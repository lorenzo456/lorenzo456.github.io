---
layout: default
title: Blog
nav: Blog
---
                {% for post in site.posts %}
                <article class="px-4 mb-5 mx-auto" style="max-width: 44rem;">
                    <p class="small text-body-secondary mb-1">{{ post.date | date: "%-d %B %Y" }}</p>
                    <h2 class="h4 fw-bold"><a href="{{ post.url | relative_url }}" class="text-body text-decoration-none">{{ post.title }}</a></h2>
                    <p class="text-body-secondary mb-2">{{ post.description | default: post.excerpt | strip_html | truncatewords: 40 }}</p>
                    <a href="{{ post.url | relative_url }}" class="fw-semibold text-decoration-none">Read more <i class="bi bi-arrow-right"></i></a>
                </article>
                {% endfor %}
